[versions]
agp                = "8.5.0"
kotlin             = "2.0.0"
coreKtx            = "1.13.1"
coroutines         = "1.8.1"
okhttp             = "4.12.0"
firebaseBom        = "33.1.0"
encryptedPrefs     = "1.1.0-alpha06"
googleServices     = "4.4.2"

# Example app only
appcompat          = "1.7.0"
material           = "1.12.0"
lifecycleRuntime   = "2.8.3"

[libraries]
# AndroidX
androidx-core-ktx              = { group = "androidx.core",             name = "core-ktx",                    version.ref = "coreKtx" }
androidx-appcompat             = { group = "androidx.appcompat",        name = "appcompat",                   version.ref = "appcompat" }
material                       = { group = "com.google.android.material",name = "material",                   version.ref = "material" }
lifecycle-runtime-ktx          = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",       version.ref = "lifecycleRuntime" }

# Coroutines
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",  version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Networking
okhttp                         = { group = "com.squareup.okhttp3",       name = "okhttp",                     version.ref = "okhttp" }
okhttp-logging                 = { group = "com.squareup.okhttp3",       name = "logging-interceptor",        version.ref = "okhttp" }

# Firebase
firebase-bom                   = { group = "com.google.firebase",        name = "firebase-bom",               version.ref = "firebaseBom" }
firebase-messaging-ktx         = { group = "com.google.firebase",        name = "firebase-messaging-ktx" }

# Encrypted SharedPreferences (stable device ID storage)
androidx-security-crypto       = { group = "androidx.security",          name = "security-crypto",            version.ref = "encryptedPrefs" }

[plugins]
android-library      = { id = "com.android.library",        version.ref = "agp" }
android-application  = { id = "com.android.application",    version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-services      = { id = "com.google.gms.google-services", version.ref = "googleServices" }
